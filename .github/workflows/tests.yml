name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app scripts tests --select F821,F822,F823
      - run: python -m compileall -q app scripts tests
      - run: python -m pytest -q
