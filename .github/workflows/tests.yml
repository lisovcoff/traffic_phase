name: tests

on:
  push:
    branches: [main, v9-integration]
  pull_request:
  merge_group:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts tests
      - run: python -m pytest -q
      - run: python -m scripts.e2e_smoke

  v9-merge-benchmark:
    name: V9 merge benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run 500+500 redundancy benchmark
        run: |
          python -m scripts.v9_merge_e2e_synthetic_benchmark             --cases-per-class 500             --seed 20261003             --output /tmp/v9_merge_benchmark.json
      - name: Enforce 98 percent acceptance
        run: |
          python - <<'PY'
          import json
          with open("/tmp/v9_merge_benchmark.json", encoding="utf-8") as handle:
              report = json.load(handle)
          metrics = report["redundancy_policy"]
          print(metrics)
          assert metrics["balanced_accuracy"] >= 0.98, metrics
          assert metrics["true2_merge_recall"] >= 0.98, metrics
          assert metrics["true3_false_merge_rate"] <= 0.04, metrics
          PY

  lenina-regression:
    name: Lenina regression
    runs-on: ubuntu-latest
    # The fixture is tracked with Git LFS. Do not use hashFiles() here:
    # job-level conditions run before checkout, so the workspace file cannot
    # be inspected at this point.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify Lenina fixture
        run: |
          test -s tests/fixtures/lenina_video_sample_20mb.json
          test "$(head -c 7 tests/fixtures/lenina_video_sample_20mb.json)" != "version"
      - name: Run Lenina kinematic regression
        run: |
          python -m scripts.ci_lenina_regression \
            tests/fixtures/lenina_video_sample_20mb.json
