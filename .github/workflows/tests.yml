name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts tests
      - run: python -m pytest -q
      - run: python -m scripts.e2e_smoke

  lenina-regression:
    name: Lenina regression
    runs-on: ubuntu-latest
    # The large real-data fixture is intentionally kept outside normal source
    # history. Once it is added under tests/fixtures/ via Git LFS, this job
    # becomes an automatic regression gate.
    if: hashFiles('tests/fixtures/lenina_video_sample_20mb.json') != ''
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run Lenina kinematic regression
        run: |
          python -m scripts.ci_lenina_regression \
            tests/fixtures/lenina_video_sample_20mb.json
